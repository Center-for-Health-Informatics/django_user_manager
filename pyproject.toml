[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "user_manager"
dynamic = ["version"]
description = "Django app for integrating Django project with CHI_AUTH system"
readme = "README.md"
requires-python = ">=3.12"
# not open source; LicenseRef-* is how PEP 639 spells a private/custom license
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "John Meinken", email = "meinkejf@ucmail.uc.edu" },
    { name = "Rob Ireton", email = "iretonrt@ucmail.uc.edu" },
]
classifiers = [
    # deliberately invalid, so an accidental `twine upload` is rejected by PyPI
    "Private :: Do Not Upload",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # floor at 6.0, ceiling open to the next major. Every consumer pins >=6.1,<6.2; 6.0
    # is one release of slack, not a version anyone runs. 5.2 was dropped in 4.0.0 —
    # it was never exercised by any deployment and kept the Python floor at 3.10.
    "Django>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Center-for-Health-Informatics/django_user_manager"

[tool.setuptools.dynamic]
version = { attr = "user_manager.__version__" }

[tool.setuptools.packages.find]
include = ["user_manager*"]

[tool.setuptools.package-data]
user_manager = ["templates/**/*"]

[tool.ruff]
line-length = 100
# py312 because that is this package's floor (requires-python), not the 3.14 every
# consumer runs. An application pins its runtime; a library states the oldest it supports.
target-version = "py312"
# the README's code blocks are illustrative fragments, not code to be formatted
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import order, UP pyupgrade, B bugbear, DJ django, S bandit
select = ["E", "F", "I", "UP", "B", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how tests are written; hard-coded passwords are the point of an auth test suite
"tests/*" = ["S101", "S105", "S106"]
